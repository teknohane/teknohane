<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#060B14">
<title>Teknohane · Bağlantı yok</title>
<style>
:root{--bg:#060B14;--surf:#0E1726;--text:#E8EEF7;--text2:#9FB0C8;--border:#1C2A42;--accent:#3AA8FF}
@media (prefers-color-scheme: light){:root{--bg:#F4F7FB;--surf:#FFFFFF;--text:#0B1B33;--text2:#4A5E7A;--border:#D5DFEC;--accent:#0A63D8}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}
.card{max-width:380px;width:100%;background:var(--surf);border:1px solid var(--border);border-radius:18px;padding:28px 22px;text-align:center}
img{width:72px;height:72px;border-radius:18px}
h1{font-size:20px;margin:16px 0 8px}
p{font-size:14px;line-height:1.5;color:var(--text2);margin:0 0 10px}
button{margin-top:10px;min-height:46px;width:100%;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
small{display:block;margin-top:14px;font-size:12px;color:var(--text2)}
</style>
</head>
<body>
<main>
  <div class="card" role="status" aria-live="polite">
    <img src="/icons/icon-192.png" width="72" height="72" alt="Teknohane">
    <h1>İnternet bağlantısı yok</h1>
    <p>Teknohane şu anda açılamıyor. Pazar, mesajlar, fiyatlar ve karşılaştırma gibi canlı veriler çevrimdışı çalışmaz.</p>
    <p>Bağlantın geri geldiğinde tekrar dene.</p>
    <button type="button" id="tekrar">Tekrar dene</button>
    <small id="durum">Bağlantı bekleniyor…</small>
  </div>
</main>
<script>
(function () {
  var durum = document.getElementById('durum');
  function git() { location.replace('/'); }
  document.getElementById('tekrar').addEventListener('click', function () { durum.textContent = 'Deneniyor…'; setTimeout(git, 200); });
  window.addEventListener('online', git);   // bağlantı gelince ana uygulamaya dön
})();
</script>
</body>
</html>

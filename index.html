<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#00040F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Teknohane — Bakımda</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#00040F;--surf:#0D1526;--surf2:#111D33;
  --cyan:#00D4FF;--cglow:rgba(0,212,255,0.25);
  --text:#FFF;--text2:#8E9BB5;--text3:#4A5568;
  --border:rgba(0,212,255,0.12);
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
}
html,body{
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans',-apple-system,sans-serif;
  overflow:hidden;
}
body{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:32px 24px;
  padding-top:calc(var(--st) + 32px);
  padding-bottom:calc(var(--sb) + 32px);
  text-align:center;
  min-height:100dvh;
}

/* Arka plan partiküller efekti */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse 60% 40% at 50% 0%, rgba(0,212,255,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 40% 60% at 80% 80%, rgba(0,128,255,0.04) 0%, transparent 70%);
  pointer-events:none;
}

.logo{
  width:90px;
  height:90px;
  border-radius:24px;
  object-fit:cover;
  box-shadow:0 0 40px var(--cglow);
  margin-bottom:28px;
  animation:pulse 3s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 30px var(--cglow);}
  50%{box-shadow:0 0 55px var(--cglow),0 0 80px rgba(0,212,255,0.1);}
}

.icon{
  font-size:48px;
  margin-bottom:20px;
  animation:spin 3s linear infinite;
  display:block;
}
@keyframes spin{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}

h1{
  font-size:26px;
  font-weight:700;
  letter-spacing:-.5px;
  margin-bottom:12px;
  background:linear-gradient(135deg,#fff,var(--cyan));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

.subtitle{
  font-size:15px;
  color:var(--text2);
  line-height:1.6;
  max-width:300px;
  margin-bottom:36px;
}

.card{
  background:var(--surf);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px 24px;
  width:100%;
  max-width:360px;
  margin-bottom:20px;
}

.card-title{
  font-size:12px;
  font-weight:600;
  color:var(--text3);
  text-transform:uppercase;
  letter-spacing:.8px;
  margin-bottom:12px;
}

.steps{
  display:flex;
  flex-direction:column;
  gap:10px;
  text-align:left;
}

.step{
  display:flex;
  align-items:flex-start;
  gap:10px;
  font-size:14px;
  color:var(--text2);
  line-height:1.4;
}

.step-dot{
  width:20px;
  height:20px;
  border-radius:50%;
  background:var(--cdim, rgba(0,212,255,0.12));
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:700;
  color:var(--cyan);
  flex-shrink:0;
  margin-top:1px;
}
.cdim{background:rgba(0,212,255,0.12);}

.bar{
  width:100%;
  max-width:360px;
  height:3px;
  background:var(--surf2);
  border-radius:999px;
  overflow:hidden;
  margin-bottom:32px;
}
.bar-fill{
  height:100%;
  background:linear-gradient(90deg,var(--cyan),#0080ff);
  border-radius:999px;
  animation:barload 2.5s ease-in-out infinite;
  transform-origin:left;
}
@keyframes barload{
  0%{width:0%;opacity:1;}
  70%{width:85%;opacity:1;}
  90%{width:92%;opacity:.7;}
  100%{width:100%;opacity:0;}
}

.wa-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:rgba(37,211,102,.12);
  border:1px solid rgba(37,211,102,.25);
  color:#25D366;
  font-size:14px;
  font-weight:600;
  padding:12px 20px;
  border-radius:14px;
  text-decoration:none;
  font-family:inherit;
}

.version{
  position:fixed;
  bottom:calc(var(--sb) + 16px);
  font-size:11px;
  color:var(--text3);
}
</style>
</head>
<body>

<img class="logo" src="teknohane.png" alt="Teknohane" onerror="this.style.display='none'">

<h1>Bakım Çalışması</h1>
<p class="subtitle">Teknohane'yi daha iyi bir hale getirmek için kısa süreliğine çalışmalar yapıyoruz.</p>

<div class="bar"><div class="bar-fill"></div></div>

<div class="card">
  <div class="card-title">Ne Yapıyoruz?</div>
  <div class="steps">
    <div class="step"><div class="step-dot cdim">1</div><span>Sistem güncellemeleri ve iyileştirmeler uygulanıyor</span></div>
    <div class="step"><div class="step-dot cdim">2</div><span>Performans optimizasyonları yapılıyor</span></div>
    <div class="step"><div class="step-dot cdim">3</div><span>Yeni özellikler hazırlanıyor</span></div>
  </div>
</div>

  </svg>
  Destek Hattı
</a>

<div class="version">Teknohane</div>

</body>
</html>

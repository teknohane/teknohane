name: Phone Cache Sync

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/phone-cache-sync.mjs
        env:
          INTERNAL_SHARED_KEY: ${{ secrets.INTERNAL_SHARED_KEY }}
          MOBILEAPI_KEY: ${{ secrets.MOBILEAPI_KEY }}
